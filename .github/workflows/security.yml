name: Security as Code

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detectar secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov:
    name: Analizar Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform

  trivy:
    name: Analizar imagen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t security-as-code-lab:${{ github.sha }} .
      - name: Escanear imagen
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: security-as-code-lab:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
